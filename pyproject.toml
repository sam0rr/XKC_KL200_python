[project]
name = "xkc-kl200-python"
version = "3.0.0"
description = "A typed Python library for controlling the XKC-KL200 UART laser distance sensor."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
addopts = "-v --maxfail=1 --cov=xkc_kl200_python"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["serial"]
ignore_missing_imports = true
